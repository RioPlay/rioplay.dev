name: Build & Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.162.0"
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # full history so .GitInfo / lastmod work

      - name: Install Ruby + Asciidoctor
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install asciidoctor rouge

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --gc --minify --baseURL "https://rioplay.dev/"

      # PaperMod's built-in Fuse.js search is used, so no Pagefind step is needed.
      # If you later switch to Pagefind, add: npx -y pagefind --site public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=rioplay-dev
