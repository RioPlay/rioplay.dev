    identifier = "series"
    name = "Series"
    url = "/series/"
    weight = 20
  [[menu.main]]
    identifier = "glossary"
    name = "Glossary"
    url = "/glossary/"
    weight = 30
  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
